<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes — POST</title>
</head>
<body>
    <h1>Saisie des notes</h1>

    <!-- method="post" : les données sont envoyées dans le corps de la requête,
         elles n'apparaissent PAS dans l'URL -->
    <form action="traitement.php" method="post">
        <p>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>
        </p>
        <p>
            <label for="note_info">Note Informatique (sur 20) :</label>
            <input type="number" id="note_info" name="note_info"
                   min="0" max="20" step="0.5" required>
        </p>
        <p>
            <label for="note_math">Note Mathématiques (sur 20) :</label>
            <input type="number" id="note_math" name="note_math"
                   min="0" max="20" step="0.5" required>
        </p>
        <p>
            <input type="submit" value="Envoyer">
            <input type="reset" value="Effacer">
        </p>
    </form>
</body>
</html>
